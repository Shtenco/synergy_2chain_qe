[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz_runs = 256
ffi = false

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_fork = "${BASE_FORK_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}" }
